    <main>
        <h2>Five HTML Tags</h2>

        <dl>
            <dt>p</dt>
            <dd>Defines a paragraph.</dd>

            <dt>h1</dt>
            <dd>Defines the main heading.</dd>

            <dt>em</dt>
            <dd>Emphasizes text.</dd>

            <dt>abbr</dt>
            <dd>Defines an abbreviation.</dd>

            <dt>sup</dt>
            <dd>Displays superscript text.</dd>
        </dl>
    </main>
