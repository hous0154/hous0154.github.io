        <h2>Five HTML Tags I Learned</h2>

        <ul>
            <li><strong>&lt;p&gt;</strong> — Defines a paragraph of text.</li>
            <li><strong>&lt;h1&gt;</strong> — Creates the main heading on a page.</li>
            <li><strong>&lt;em&gt;</strong> — Emphasizes text, usually shown in italics.</li>
            <li><strong>&lt;abbr&gt;</strong> — Marks an abbreviation, e.g. 
                <abbr title="HyperText Markup Language">HTML</abbr>.
            </li>
            <li><strong>&lt;sup&gt;</strong> — Displays text as superscript (raised text).</li>
        </ul>
    </main>
